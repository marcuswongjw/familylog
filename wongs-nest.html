<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wong's Nest</title>
<style>
body{margin:0;background:#fff;color:#222;font-family:Trebuchet MS,system-ui,sans-serif}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:18px 18px 88px}
h1{text-align:center;font-family:Georgia,Palatino,serif;font-size:42px;font-weight:500;margin:12px 0 8px}
.jar{width:72px;height:84px;margin:8px auto;border:3px solid #222;border-radius:8px 8px 16px 16px;position:relative}
.jar:before{content:"";position:absolute;left:18px;right:18px;top:-8px;height:10px;border:3px solid #222;background:#fff}
.berries{position:absolute;left:14px;right:14px;bottom:10px;height:34px;background:radial-gradient(circle at 10px 10px,#e25b4a 7px,transparent 8px),radial-gradient(circle at 28px 10px,#e25b4a 7px,transparent 8px),radial-gradient(circle at 18px 24px,#c0392b 7px,transparent 8px)}
.count{text-align:center;font-size:20px;margin:10px 0 18px}
.family{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:22px}
.blob{width:62px;height:58px;border-radius:46% 46% 42% 42%;border:3px solid #222;position:relative}
.blob:after{content:"";position:absolute;left:16px;top:22px;width:8px;height:8px;border-radius:50%;box-shadow:18px 0 #222,6px 16px 0 -2px #222}
.scarf{position:absolute;left:8px;right:8px;bottom:6px;height:12px;background:repeating-linear-gradient(90deg,#fff 0 4px,#e25b4a 4px 8px);border-radius:6px}
.hat{position:absolute;left:8px;right:8px;top:-12px;height:14px;background:#f2d56b;border:3px solid #222;border-radius:10px 10px 2px 2px}
.bag{position:absolute;right:-14px;top:18px;width:16px;height:20px;background:#7dbe8a;border:3px solid #222;border-radius:4px}
.bird{width:28px;height:22px;background:#7eb8c9;border:3px solid #222;border-radius:50%;margin-bottom:16px}
.name{text-align:center;font-size:12px;margin-top:4px}
.check{display:flex;gap:12px;align-items:center;width:100%;border:0;background:#fff;font:inherit;font-size:22px;padding:10px 8px;text-align:left}
.box{width:26px;height:26px;border:3px solid #222;display:grid;place-items:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;border-top:1px solid #eee;background:#fff}
nav button{flex:1;border:0;background:#fff;padding:14px 0 18px;font-size:22px}
.hidden{display:none}
.shop-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px dashed #ddd;background:#fff;padding:12px 0;font:inherit;font-size:18px;text-align:left}
.pixel{width:36px;height:28px;border:3px solid #222}
.pets{display:flex;gap:10px;margin-top:18px}
.petcard{width:92px;height:92px;border:3px solid #ddd;border-radius:12px;background:#fff;font:inherit}
.petcard.on{border-color:#e25b4a}
.lock{opacity:.45}
.hop{animation:hop .4s}@keyframes hop{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="app">
<div id="home"><h1>Wong's Nest</h1><div class="jar"><div class="berries"></div></div><div class="count" id="count"></div><div class="family" id="family"></div><div id="quests"></div></div>
<div id="wear" class="hidden"><h1 id="wear-title" style="font-family:monospace">Mikaela</h1><div class="family" id="focus"></div><div id="list"></div><div class="pets" id="pets"></div></div>
</div>
<nav><button onclick="show('home')">Nest</button><button onclick="show('clothes')">Clothes</button><button onclick="show('pets')">Pets</button><button onclick="show('shop')">Shop</button></nav>
<script>
const members=[{id:'Marcus',color:'#8fbf8a'},{id:'Eleanor',color:'#f09090'},{id:'Mikaela',color:'#f2d56b'},{id:'Meaghan',color:'#7eb8c9'}];
const clothes=[{id:'hat',name:'Sunny hat',price:12},{id:'scarf',name:'Scarf',price:12},{id:'bag',name:'Star jumper',price:12}];
const pets=[{id:'bird',name:'Bird',price:20},{id:'cat',name:'Cat',price:40},{id:'pup',name:'Puppy',price:80}];
const state={me:'Eleanor',pocket:24,jar:8,worn:{Eleanor:{scarf:true}},pet:{Eleanor:'bird'},done:{}};
const quests=['School bag packed','Read together','Water the plants'];
function sprite(id,hop){const m=members.find(x=>x.id===id);const w=state.worn[id]||{};return '<div class="'+(hop?'hop':'')+'" onclick="state.me=\''+id+'\';paint()"><div class="blob" style="background:'+m.color+'">'+(w.hat?'<span class="hat"></span>':'')+(w.scarf?'<span class="scarf"></span>':'')+(w.bag?'<span class="bag"></span>':'')+'</div>'+(state.pet[id]==='bird'?'<div class="bird"></div>':'')+'<div class="name">'+id+'</div></div>';}
function show(tab){document.getElementById('home').classList.toggle('hidden',tab!=='home');document.getElementById('wear').classList.toggle('hidden',tab==='home');if(tab==='home')return paint();document.getElementById('wear-title').textContent=state.me;document.getElementById('focus').innerHTML=sprite(state.me);const list=document.getElementById('list');if(tab==='clothes'||tab==='shop')list.innerHTML=clothes.map(c=>'<button class="shop-row" onclick="buy(\''+c.id+'\')"><span class="pixel"></span>'+c.name+'<br>berry '+c.price+'</button>').join('');if(tab==='pets')list.innerHTML='';document.getElementById('pets').innerHTML=pets.map(p=>'<button class="petcard '+(state.pet[state.me]===p.id?'on':'')+' '+(p.id==='pup'?'lock':'')+'" onclick="buyPet(\''+p.id+'\')">'+p.name+'</button>').join('');}
function buy(id){const item=clothes.find(c=>c.id===id);const who=state.me;state.worn[who]=state.worn[who]||{};if(!state.worn[who][id]){if(state.pocket<item.price)return alert('Not enough berries');state.pocket-=item.price;}state.worn[who][id]=!state.worn[who][id];show('clothes');}
function buyPet(id){const item=pets.find(p=>p.id===id);if(state.pet[state.me]!==id&&state.pocket<item.price)return alert('Not enough berries');if(state.pet[state.me]!==id)state.pocket-=item.price;state.pet[state.me]=id;show('pets');}
function check(i){const id=state.me+i;state.done[id]=!state.done[id];state.jar+=state.done[id]?1:-1;state.pocket+=state.done[id]?1:-1;paint(true);}
function paint(hop){document.getElementById('count').textContent=state.jar+' of 20 berries';document.getElementById('family').innerHTML=members.map(m=>sprite(m.id,hop&&m.id===state.me)).join('');document.getElementById('quests').innerHTML=quests.map((q,i)=>'<button class="check" onclick="check('+i+')"><span class="box">'+(state.done[state.me+i]?'\u2713':'')+'</span>'+q+'</button>').join('');}
paint();
</script>
</body>
</html>
