<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wong Family Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --cream: #fdf6ee;
    --warm-white: #fff9f3;
    --brown: #5c3d2e;
    --brown-light: #8b6355;
    --terracotta: #c4704f;
    --terracotta-light: #e8a98a;
    --sage: #7a9e87;
    --sage-light: #b5cebe;
    --gold: #c9a84c;
    --blush: #e8b4b8;
    --text: #3a2a1e;
    --text-soft: #7a6258;
    --card-bg: rgba(255,249,243,0.9);
    --shadow: 0 4px 24px rgba(92,61,46,0.10);
    --shadow-hover: 0 8px 40px rgba(92,61,46,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 0% 0%, rgba(196,112,79,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(122,158,135,0.08) 0%, transparent 50%);
  }

  /* ---- LOGIN ---- */
  #login-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(196,112,79,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(122,158,135,0.10) 0%, transparent 50%);
  }

  .login-box {
    background: var(--card-bg);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 24px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
    box-shadow: var(--shadow-hover);
    backdrop-filter: blur(10px);
    animation: fadeUp 0.6s ease;
  }

  .login-icon { font-size: 48px; margin-bottom: 16px; }
  .login-box h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--brown); margin-bottom: 6px; }
  .login-box p  { color: var(--text-soft); font-size: 14px; margin-bottom: 32px; }

  .login-box input {
    width: 100%; padding: 14px 18px;
    border: 1.5px solid rgba(92,61,46,0.15);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    background: var(--warm-white); color: var(--text);
    outline: none; transition: border-color 0.2s;
    margin-bottom: 14px; letter-spacing: 2px;
  }

  .login-box input:focus { border-color: var(--terracotta); }

  .login-box button {
    width: 100%; padding: 14px;
    background: var(--terracotta); color: white; border: none;
    border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .login-box button:hover  { background: var(--brown); }
  .login-box button:active { transform: scale(0.98); }
  .login-error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

  /* ---- DASHBOARD ---- */
  #dashboard { display: none; }

  header {
    padding: 32px 40px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(92,61,46,0.08);
  }

  .header-left h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--brown); line-height: 1.1; }
  .header-left p  { color: var(--text-soft); font-size: 14px; margin-top: 4px; }
  .header-right   { display: flex; align-items: center; gap: 12px; }

  .refresh-btn {
    padding: 8px 16px; background: var(--terracotta); color: white; border: none;
    border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.2s;
  }
  .refresh-btn:hover { background: var(--brown); }

  .logout-btn {
    padding: 8px 16px; background: transparent; color: var(--text-soft);
    border: 1px solid rgba(92,61,46,0.2); border-radius: 8px;
    font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .logout-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }

  main { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

  /* ---- SUMMARY CARDS ---- */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px; margin-bottom: 40px;
  }

  .card {
    background: var(--card-bg); border-radius: 20px; padding: 24px;
    border: 1px solid rgba(92,61,46,0.08); box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s; backdrop-filter: blur(8px);
    animation: fadeUp 0.5s ease both;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-icon  { font-size: 28px; margin-bottom: 12px; }
  .card-label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--text-soft); margin-bottom: 6px; }
  .card-value { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--brown); line-height: 1; margin-bottom: 4px; }
  .card-sub   { font-size: 13px; color: var(--text-soft); }
  .card.terracotta { border-top: 3px solid var(--terracotta); }
  .card.sage       { border-top: 3px solid var(--sage); }
  .card.gold       { border-top: 3px solid var(--gold); }
  .card.blush      { border-top: 3px solid var(--blush); }
  .card.brown      { border-top: 3px solid var(--brown-light); }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }

  /* ---- SECTION HEADERS ---- */
  .section-title {
    font-family: 'Playfair Display', serif; font-size: 22px; color: var(--brown);
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }

  /* ---- TABLE CARDS ---- */
  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 24px;
  }

  .table-card {
    background: var(--card-bg); border-radius: 20px;
    border: 1px solid rgba(92,61,46,0.08); box-shadow: var(--shadow);
    overflow: hidden; animation: fadeUp 0.5s ease both;
  }

  .table-card:nth-child(1)  { animation-delay: 0.10s; }
  .table-card:nth-child(2)  { animation-delay: 0.15s; }
  .table-card:nth-child(3)  { animation-delay: 0.20s; }
  .table-card:nth-child(4)  { animation-delay: 0.25s; }
  .table-card:nth-child(5)  { animation-delay: 0.30s; }
  .table-card:nth-child(6)  { animation-delay: 0.35s; }
  .table-card:nth-child(7)  { animation-delay: 0.40s; }
  .table-card:nth-child(8)  { animation-delay: 0.45s; }
  .table-card:nth-child(9)  { animation-delay: 0.50s; }
  .table-card:nth-child(10) { animation-delay: 0.55s; }

  .table-header {
    padding: 18px 24px; border-bottom: 1px solid rgba(92,61,46,0.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-header h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--brown); }

  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .badge-terracotta { background: rgba(196,112,79,0.12); color: var(--terracotta); }
  .badge-sage       { background: rgba(122,158,135,0.12); color: var(--sage); }
  .badge-gold       { background: rgba(201,168,76,0.12);  color: #9a7a2c; }
  .badge-blush      { background: rgba(232,180,184,0.2);  color: #a0606a; }
  .badge-brown      { background: rgba(92,61,46,0.10);    color: var(--brown-light); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    padding: 10px 24px; text-align: left; font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-soft);
    background: rgba(92,61,46,0.03); border-bottom: 1px solid rgba(92,61,46,0.06);
  }
  td { padding: 12px 24px; border-bottom: 1px solid rgba(92,61,46,0.05); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(196,112,79,0.03); }

  .empty-state { padding: 28px 24px; text-align: center; color: var(--text-soft); font-size: 14px; }
  .empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* ---- OVERFLOW NOTE ---- */
  .overflow-note {
    padding: 10px 24px; font-size: 12px; color: var(--text-soft);
    background: rgba(92,61,46,0.03); border-top: 1px solid rgba(92,61,46,0.06);
    text-align: center; font-style: italic;
  }

  /* ---- FERTILITY ---- */
  .fertility-card {
    background: linear-gradient(135deg, rgba(232,180,184,0.15), rgba(201,168,76,0.08));
    border: 1px solid rgba(232,180,184,0.3) !important;
  }
  .fertility-row { display: flex; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid rgba(232,180,184,0.15); font-size: 14px; }
  .fertility-row:last-child { border-bottom: none; }
  .fertility-label { color: var(--text-soft); }
  .fertility-value { font-weight: 500; color: var(--brown); }

  /* ---- BIRTHDAY CARD ---- */
  .birthday-card {
    background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(196,112,79,0.06));
    border: 1px solid rgba(201,168,76,0.25) !important;
  }
  .birthday-today {
    background: rgba(201,168,76,0.10);
    font-weight: 600;
  }
  .birthday-tomorrow {
    background: rgba(196,112,79,0.06);
  }
  .birthday-week {
    background: rgba(122,158,135,0.05);
  }

  /* ---- EXPENSE SPLIT ---- */
  .expense-tabs { display: flex; border-bottom: 1px solid rgba(92,61,46,0.08); }
  .expense-tab {
    flex: 1; padding: 12px 16px; text-align: center; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--text-soft); border-bottom: 2px solid transparent;
    transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none;
    font-family: 'DM Sans', sans-serif;
  }
  .expense-tab.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }
  .expense-tab:hover  { color: var(--brown); }
  .expense-panel { display: none; }
  .expense-panel.active { display: block; }

  .expense-account-row-header {
    display: flex; border-bottom: 1px solid rgba(92,61,46,0.06);
  }
  .expense-account-col {
    flex: 1; padding: 14px 24px;
    border-right: 1px solid rgba(92,61,46,0.06);
  }
  .expense-account-col:last-child { border-right: none; }
  .expense-account-col .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-soft); margin-bottom: 4px; }
  .expense-account-col .value { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--brown); }

  /* Pie chart only */
  .pie-wrapper { padding: 20px 24px; display: flex; align-items: center; gap: 24px; }
  .pie-canvas-wrap { flex-shrink: 0; width: 140px; height: 140px; }
  .pie-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
  .pie-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .pie-legend-name { flex: 1; }
  .pie-legend-val  { font-weight: 500; color: var(--brown); }

  /* ---- KIDS SECTIONS ---- */
  .kid-section { border-bottom: 1px solid rgba(92,61,46,0.06); }
  .kid-section:last-child { border-bottom: none; }
  .kid-section-header {
    padding: 14px 24px 10px;
    font-size: 13px; font-weight: 600; color: var(--brown-light);
    text-transform: uppercase; letter-spacing: 0.8px;
    background: rgba(92,61,46,0.02);
  }

  /* ---- PERSON TASK BLOCKS ---- */
  .person-block { border-bottom: 1px solid rgba(92,61,46,0.06); }
  .person-block:last-child { border-bottom: none; }
  .person-block-header {
    padding: 12px 24px 8px;
    font-size: 13px; font-weight: 600; color: var(--brown-light);
    background: rgba(92,61,46,0.02);
    display: flex; justify-content: space-between; align-items: center;
  }
  .person-count { font-size: 11px; color: var(--text-soft); font-weight: 400; }

  /* ---- LOADING ---- */
  .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-soft); font-size: 14px; gap: 10px; }
  .spinner { width: 20px; height: 20px; border: 2px solid rgba(92,61,46,0.15); border-top-color: var(--terracotta); border-radius: 50%; animation: spin 0.8s linear infinite; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin   { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    header { padding: 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
    main { padding: 20px; }
    .tables-grid { grid-template-columns: 1fr; }
    .cards-grid  { grid-template-columns: repeat(2, 1fr); }
    .pie-wrapper { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🏠</div>
    <h1>Wong Family</h1>
    <p>Enter your family password to continue</p>
    <input type="password" id="password-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter Dashboard</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="header-left">
      <h1>Wong Family Dashboard 🏠</h1>
      <p id="last-updated">Loading...</p>
      <p id="refresh-countdown" style="font-size:12px;color:var(--text-soft);margin-top:2px;opacity:0.7;"></p>
    </div>
    <div class="header-right">
      <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="section-title"><span>📊</span> Overview</div>
    <div class="cards-grid" id="cards-grid">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>

    <div class="section-title" style="margin-top:8px;"><span>📋</span> Details</div>
    <div class="tables-grid" id="tables-grid">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>
  </main>
</div>

<script>
const PASSWORD = 'familyisLOVE';
const API      = '/dashboard-data';
const FAMILY   = ['Mikaela', 'Meaghan', 'Eleanor', 'Marcus', 'Everyone'];
const KIDS     = ['Mikaela', 'Meaghan', 'Eleanor'];

const MILESTONE_KEYWORDS = ['birthday', 'anniversary', 'graduation', 'wedding', 'christening', 'baptism', 'christmas', 'new year', 'cny', 'chinese new year', 'deepavali', 'hari raya', 'diwali'];

const PIE_COLOURS = [
  '#c4704f','#e8a98a','#7a9e87','#b5cebe','#c9a84c',
  '#e8d5a3','#8b6355','#e8b4b8','#5c3d2e','#a0606a',
  '#d4956e','#94b8a0','#d9bb72','#c4a09a','#6b8f78',
  '#e0c4b0','#b07060','#8fb0a0','#d4c060','#a08080'
];

const PERSON_COLOURS = {
  Mikaela: '#7a9e87', Meaghan: '#c9a84c',
  Eleanor: '#c4704f', Marcus:  '#5c3d2e', Everyone: '#8b6355'
};

// ---- AUTH ----
function login() {
  const val = document.getElementById('password-input').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display    = 'block';
    sessionStorage.setItem('wf_auth', '1');
    loadDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-input').focus();
  }
}

function logout() {
  sessionStorage.removeItem('wf_auth');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display    = 'none';
  document.getElementById('password-input').value = '';
}

if (sessionStorage.getItem('wf_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display    = 'block';
  loadDashboard();
}

// ---- AUTO-REFRESH (every 5 minutes) ----
const REFRESH_INTERVAL = 5 * 60;
let refreshTimer  = null;
let countdownSecs = REFRESH_INTERVAL;

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  countdownSecs = REFRESH_INTERVAL;
  refreshTimer = setInterval(() => {
    countdownSecs--;
    updateCountdown();
    if (countdownSecs <= 0) {
      countdownSecs = REFRESH_INTERVAL;
      loadDashboard();
    }
  }, 1000);
}

function updateCountdown() {
  const el = document.getElementById('refresh-countdown');
  if (!el) return;
  const m = Math.floor(countdownSecs / 60);
  const s = countdownSecs % 60;
  el.textContent = `auto-refresh in ${m}:${String(s).padStart(2,'0')}`;
}

// ---- DATA ----
async function loadDashboard() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  try {
    const res  = await fetch(API);
    const data = await res.json();
    renderCards(data);
    renderTables(data);
    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit' });
    startAutoRefresh();
  } catch (e) {
    document.getElementById('cards-grid').innerHTML  = '<div class="loading">Failed to load. Please refresh.</div>';
    document.getElementById('tables-grid').innerHTML = '';
    document.getElementById('last-updated').textContent = 'Failed to load';
  }
}

// ---- HELPERS ----
function isFamilyEvent(title) {
  const t = (title || '').toLowerCase();
  if (t.includes('family')) return true;
  return MILESTONE_KEYWORDS.some(kw => t.includes(kw));
}

// ---- CARDS ----
function renderCards(data) {
  const ex  = data.expenses        || {};
  const ev  = data.events          || [];
  const tbp = data.todos_by_person || {};
  const gr  = data.groceries       || [];
  const fe  = data.fertility       || {};
  const bd  = data.birthdays       || [];

  const openTasks    = FAMILY.reduce((acc, m) => acc + (tbp[m] ? tbp[m].length : 0), 0);
  const nextBirthday = bd.length > 0 ? bd[0] : null;

  document.getElementById('cards-grid').innerHTML = `
    <div class="card terracotta">
      <div class="card-icon">💰</div>
      <div class="card-label">This Month's Spending</div>
      <div class="card-value">$${(ex.month_total || 0).toFixed(2)}</div>
      <div class="card-sub">${ex.entry_count || 0} transactions</div>
    </div>
    <div class="card sage">
      <div class="card-icon">📅</div>
      <div class="card-label">Upcoming Events</div>
      <div class="card-value">${Math.min(ev.length, 10)}</div>
      <div class="card-sub">Next 14 days${ev.length > 10 ? ' · ' + ev.length + ' total' : ''}</div>
    </div>
    <div class="card gold">
      <div class="card-icon">✅</div>
      <div class="card-label">Open Tasks</div>
      <div class="card-value">${openTasks}</div>
      <div class="card-sub">across all family members</div>
    </div>
    <div class="card brown">
      <div class="card-icon">🛒</div>
      <div class="card-label">Grocery Items</div>
      <div class="card-value">${gr.length}</div>
      <div class="card-sub">items to buy</div>
    </div>
    <div class="card blush">
      <div class="card-icon">🌸</div>
      <div class="card-label">Next Period (est)</div>
      <div class="card-value" style="font-size:18px;margin-top:4px;">${fe.next_period || '—'}</div>
      <div class="card-sub">Fertile: ${fe.fertile_window || '—'}</div>
    </div>
    <div class="card gold">
      <div class="card-icon">🎂</div>
      <div class="card-label">Next Birthday</div>
      <div class="card-value" style="font-size:${nextBirthday ? '18px' : '32px'};margin-top:${nextBirthday ? '4px' : '0'};">${nextBirthday ? nextBirthday.name : '—'}</div>
      <div class="card-sub">${nextBirthday ? (nextBirthday.daysAway === 0 ? '🥳 Today!' : nextBirthday.daysAway === 1 ? '🎉 Tomorrow!' : 'In ' + nextBirthday.daysAway + ' days · ' + nextBirthday.dateLabel) : 'No birthdays saved'}</div>
    </div>
  `;
}

// ---- PIE CHART ----
let pieCharts = {};

function buildPieSection(panelId, categoryData, totalAmt) {
  if (!categoryData || Object.keys(categoryData).length === 0) return '';
  const entries = Object.entries(categoryData).sort((a, b) => b[1] - a[1]);
  const labels  = entries.map(e => e[0]);
  const values  = entries.map(e => e[1]);
  const colours = labels.map((_, i) => PIE_COLOURS[i % PIE_COLOURS.length]);
  const canvasId = `pie-${panelId}`;

  let legendHtml = '';
  entries.slice(0, 8).forEach(([cat, amt], i) => {
    const pct = totalAmt > 0 ? ((amt / totalAmt) * 100).toFixed(0) : 0;
    legendHtml += `<div class="pie-legend-item">
      <div class="pie-legend-dot" style="background:${colours[i]};"></div>
      <span class="pie-legend-name">${cat}</span>
      <span class="pie-legend-val">${pct}%</span>
    </div>`;
  });
  if (entries.length > 8) {
    legendHtml += `<div class="pie-legend-item" style="color:var(--text-soft);font-size:11px;">+${entries.length - 8} more categories</div>`;
  }

  setTimeout(() => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (pieCharts[canvasId]) pieCharts[canvasId].destroy();
    pieCharts[canvasId] = new Chart(canvas, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colours, borderWidth: 2, borderColor: '#fdf6ee', hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: $${ctx.raw.toFixed(2)}` } }
        },
        animation: { animateRotate: true, duration: 800 }
      }
    });
  }, 50);

  return `
    <div class="pie-wrapper">
      <div class="pie-canvas-wrap"><canvas id="${canvasId}"></canvas></div>
      <div class="pie-legend">${legendHtml}</div>
    </div>`;
}

function switchTab(name, btn) {
  document.querySelectorAll('.expense-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.expense-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
}

// ---- TABLES ----
function renderTables(data) {
  const ex   = data.expenses        || {};
  const ev   = data.events          || [];
  const tbp  = data.todos_by_person || {};
  const gr   = data.groceries       || [];
  const fe   = data.fertility       || {};
  const kc   = data.kids_calendar   || {};
  const bd   = data.birthdays       || [];

  let html = '';

  // ------------------------------------------------------------------ 1. UPCOMING FAMILY EVENTS
  const familyEvents = ev.filter(e => isFamilyEvent(e.title));

  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>🏠 Upcoming Family Events</h3>
      <span class="badge badge-sage">${familyEvents.length} event${familyEvents.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="table-body">`;

  if (familyEvents.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📆</div>No family events in the next 14 days</div>`;
  } else {
    html += `<table><thead><tr><th>Date</th><th>Time</th><th>Event</th></tr></thead><tbody>`;
    familyEvents.forEach(e => {
      html += `<tr><td>${e.date}</td><td>${e.time}</td><td>${e.title}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 2. ALL UPCOMING EVENTS (max 10)
  const evCapped   = ev.slice(0, 10);
  const evOverflow = ev.length > 10 ? ev.length - 10 : 0;

  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>📅 Upcoming Events</h3>
      <span class="badge badge-sage">Next 14 days</span>
    </div>
    <div class="table-body">`;

  if (evCapped.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📆</div>No upcoming events</div>`;
  } else {
    html += `<table><thead><tr><th>Date</th><th>Time</th><th>Event</th><th>Who</th></tr></thead><tbody>`;
    evCapped.forEach(e => {
      const tagHtml = e.tags && e.tags.length > 0
        ? e.tags.map(t => `<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:${PERSON_COLOURS[t] || '#c4704f'}22;color:${PERSON_COLOURS[t] || '#c4704f'};margin-right:3px;">${t}</span>`).join('')
        : '<span style="color:var(--text-soft);font-size:12px;">—</span>';
      html += `<tr><td>${e.date}</td><td>${e.time}</td><td>${e.title}</td><td>${tagHtml}</td></tr>`;
    });
    html += `</tbody></table>`;
    if (evOverflow > 0) {
      html += `<div class="overflow-note">+ ${evOverflow} more event${evOverflow > 1 ? 's' : ''} not shown</div>`;
    }
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 3. TO-DO LIST
  const totalOpen = FAMILY.reduce((acc, m) => acc + (tbp[m] ? tbp[m].length : 0), 0);

  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>✅ To-Do List</h3>
      <span class="badge badge-gold">${totalOpen} open</span>
    </div>
    <div class="table-body">`;

  if (totalOpen === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🎉</div>All done!</div>`;
  } else {
    FAMILY.forEach(member => {
      const tasks = tbp[member] || [];
      if (tasks.length === 0) return;
      const colour = PERSON_COLOURS[member] || '#c4704f';
      html += `<div class="person-block">
        <div class="person-block-header">
          <span style="color:${colour};">● ${member}</span>
          <span class="person-count">${tasks.length} task${tasks.length > 1 ? 's' : ''}</span>
        </div>
        <table><tbody>`;
      tasks.forEach(t => {
        html += `<tr>
          <td>${t.task}</td>
          <td style="color:var(--text-soft);font-size:12px;white-space:nowrap;">${t.due ? '📅 ' + t.due : ''}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 4. MIKAELA
  {
    const kid = 'Mikaela';
    html += buildKidCard(kid, kc[kid] || [], tbp[kid] || [], PERSON_COLOURS[kid]);
  }

  // ------------------------------------------------------------------ 5. MEAGHAN
  {
    const kid = 'Meaghan';
    html += buildKidCard(kid, kc[kid] || [], tbp[kid] || [], PERSON_COLOURS[kid]);
  }

  // ------------------------------------------------------------------ 6. ELEANOR
  {
    const kid = 'Eleanor';
    html += buildKidCard(kid, kc[kid] || [], tbp[kid] || [], PERSON_COLOURS[kid]);
  }

  // ------------------------------------------------------------------ 7. EXPENSES (pie + account totals only)
  const allRows      = ex.recent || [];
  const familyRows   = allRows.filter(r => (r.account || '').toLowerCase().includes('family'));
  const personalRows = allRows.filter(r => (r.account || '').toLowerCase().includes('personal'));

  function buildCats(rows) {
    const cats = {}; let total = 0;
    rows.forEach(r => { const c = r.category || 'Other'; const a = parseFloat(r.amount) || 0; cats[c] = (cats[c] || 0) + a; total += a; });
    return { cats, total };
  }

  const familyData   = buildCats(familyRows);
  const personalData = buildCats(personalRows);
  const grandTotal   = ex.month_total || 0;

  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>💰 Expenses</h3>
      <span class="badge badge-terracotta">This Month · $${grandTotal.toFixed(2)}</span>
    </div>
    <div class="table-body">`;

  if (allRows.length === 0 && grandTotal === 0) {
    html += `<div class="empty-state"><div class="empty-icon">💸</div>No expenses this month</div>`;
  } else {
    html += `
    <div class="expense-account-row-header">
      <div class="expense-account-col">
        <div class="label">Family</div>
        <div class="value">$${familyData.total.toFixed(2)}</div>
      </div>
      <div class="expense-account-col">
        <div class="label">Personal</div>
        <div class="value">$${personalData.total.toFixed(2)}</div>
      </div>
    </div>
    <div class="expense-tabs">
      <button class="expense-tab active" onclick="switchTab('all',this)">All</button>
      <button class="expense-tab" onclick="switchTab('family',this)">Family</button>
      <button class="expense-tab" onclick="switchTab('personal',this)">Personal</button>
    </div>
    <div id="panel-all" class="expense-panel active">
      ${buildPieSection('all', ex.by_category, grandTotal)}
    </div>
    <div id="panel-family" class="expense-panel">
      ${familyData.total > 0 ? buildPieSection('family', familyData.cats, familyData.total) : '<div class="empty-state"><div class="empty-icon">💸</div>No family expenses</div>'}
    </div>
    <div id="panel-personal" class="expense-panel">
      ${personalData.total > 0 ? buildPieSection('personal', personalData.cats, personalData.total) : '<div class="empty-state"><div class="empty-icon">💸</div>No personal expenses</div>'}
    </div>`;
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 8. GROCERY LIST (max 10)
  const grCapped   = gr.slice(0, 10);
  const grOverflow = gr.length > 10 ? gr.length - 10 : 0;

  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>🛒 Grocery List</h3>
      <span class="badge badge-brown">${gr.length} item${gr.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="table-body">`;

  if (gr.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🛒</div>Nothing to buy!</div>`;
  } else {
    html += `<table><thead><tr><th>Item</th></tr></thead><tbody>`;
    grCapped.forEach(g => { html += `<tr><td>${g.name}</td></tr>`; });
    html += `</tbody></table>`;
    if (grOverflow > 0) {
      html += `<div class="overflow-note">+ ${grOverflow} more item${grOverflow > 1 ? 's' : ''} not shown</div>`;
    }
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 9. FERTILITY TRACKER
  html += `
  <div class="table-card fertility-card">
    <div class="table-header">
      <h3>🌸 Fertility Tracker</h3>
      <span class="badge badge-blush">Cycle Info</span>
    </div>
    <div class="table-body">`;

  if (!fe.last_period_start) {
    html += `<div class="empty-state"><div class="empty-icon">🌸</div>No period data logged yet</div>`;
  } else {
    [
      ['Last Period Start', fe.last_period_start || '—'],
      ['Period Duration',   fe.duration ? fe.duration + ' days' : '—'],
      ['Next Period (est)', fe.next_period    || '—'],
      ['Fertile Window',    fe.fertile_window || '—'],
      ['Last Ovulation',    fe.last_ovulation || '—'],
    ].forEach(([label, val]) => {
      html += `<div class="fertility-row"><span class="fertility-label">${label}</span><span class="fertility-value">${val}</span></div>`;
    });
  }
  html += `</div></div>`;

  // ------------------------------------------------------------------ 10. BIRTHDAYS & ANNIVERSARIES
  const bdSoon     = bd.filter(e => e.daysAway <= 30);
  const bdUpcoming = bd.filter(e => e.daysAway > 30);

  html += `
  <div class="table-card birthday-card">
    <div class="table-header">
      <h3>🎂 Birthdays & Anniversaries</h3>
      <span class="badge badge-gold">${bd.length} saved</span>
    </div>
    <div class="table-body">`;

  if (bd.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🎂</div>No birthdays saved yet — add them via the bot!</div>`;
  } else {
    if (bdSoon.length === 0) {
      html += `<div class="empty-state" style="padding:20px 24px;"><div class="empty-icon">📅</div>No birthdays in the next 30 days</div>`;
    } else {
      html += `<table><thead><tr><th>Date</th><th>Who</th><th>Type</th><th>When</th></tr></thead><tbody>`;
      bdSoon.forEach(e => {
        const rowClass = e.daysAway === 0 ? 'birthday-today'
                       : e.daysAway <= 1  ? 'birthday-tomorrow'
                       : e.daysAway <= 7  ? 'birthday-week'
                       : '';
        const when  = e.daysAway === 0 ? '🥳 Today!'
                    : e.daysAway === 1 ? '🎉 Tomorrow!'
                    : `In ${e.daysAway} days`;
        const emoji = e.type === 'Birthday' ? '🎂' : '💍';
        const age   = e.agePart
          ? `<br><span style="font-size:11px;color:var(--text-soft);">${e.agePart}</span>`
          : '';
        html += `<tr class="${rowClass}">
          <td style="white-space:nowrap;">${e.dateLabel}</td>
          <td><strong>${e.name}</strong>${age}</td>
          <td>${emoji} ${e.type}</td>
          <td style="color:var(--terracotta);font-weight:500;white-space:nowrap;">${when}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    if (bdUpcoming.length > 0) {
      html += `<div class="overflow-note">+ ${bdUpcoming.length} more coming up · next after 30 days: ${bdUpcoming[0].name} (${bdUpcoming[0].dateLabel})</div>`;
    }
  }
  html += `</div></div>`;

  document.getElementById('tables-grid').innerHTML = html;
}

// ---- KID CARD BUILDER ----
function buildKidCard(kid, kidEvents, kidTasks, colour) {
  let html = `
  <div class="table-card">
    <div class="table-header">
      <h3>👧 ${kid}</h3>
      <span class="badge badge-sage">${kidEvents.length} event${kidEvents.length !== 1 ? 's' : ''} · ${kidTasks.length} task${kidTasks.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="table-body">`;

  html += `<div class="kid-section">
    <div class="kid-section-header" style="color:${colour};">📅 Upcoming Schedule</div>`;
  if (kidEvents.length === 0) {
    html += `<div class="empty-state" style="padding:16px 24px;"><div style="color:var(--text-soft);font-size:13px;">No upcoming events — add events with ${kid}'s name in the title</div></div>`;
  } else {
    html += `<table><thead><tr><th>Date</th><th>Time</th><th>Event</th></tr></thead><tbody>`;
    kidEvents.forEach(e => {
      html += `<tr><td>${e.date}</td><td>${e.time}</td><td>${e.title}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `<div class="kid-section">
    <div class="kid-section-header" style="color:${colour};">✅ Tasks</div>`;
  if (kidTasks.length === 0) {
    html += `<div class="empty-state" style="padding:16px 24px;"><div style="color:var(--text-soft);font-size:13px;">No open tasks</div></div>`;
  } else {
    html += `<table><thead><tr><th>Task</th><th>Due</th></tr></thead><tbody>`;
    kidTasks.forEach(t => {
      html += `<tr><td>${t.task}</td><td style="color:var(--text-soft);font-size:12px;">${t.due || '—'}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `</div></div>`;
  return html;
}
</script>
