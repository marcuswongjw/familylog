<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wong Family Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --warm-white: #fff9f3;
    --brown: #5c3d2e;
    --brown-light: #8b6355;
    --terracotta: #c4704f;
    --terracotta-light: #e8a98a;
    --sage: #7a9e87;
    --sage-light: #b5cebe;
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --blush: #e8b4b8;
    --text: #3a2a1e;
    --text-soft: #7a6258;
    --card-bg: rgba(255,249,243,0.9);
    --shadow: 0 4px 24px rgba(92,61,46,0.10);
    --shadow-hover: 0 8px 40px rgba(92,61,46,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 0% 0%, rgba(196,112,79,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(122,158,135,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%);
  }

  /* ---- LOGIN ---- */
  #login-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(196,112,79,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(122,158,135,0.10) 0%, transparent 50%);
  }

  .login-box {
    background: var(--card-bg);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 24px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
    box-shadow: var(--shadow-hover);
    backdrop-filter: blur(10px);
    animation: fadeUp 0.6s ease;
  }

  .login-icon { font-size: 48px; margin-bottom: 16px; }

  .login-box h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--brown);
    margin-bottom: 6px;
  }

  .login-box p {
    color: var(--text-soft);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .login-box input {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid rgba(92,61,46,0.15);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    background: var(--warm-white);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  .login-box input:focus { border-color: var(--terracotta); }

  .login-box button {
    width: 100%;
    padding: 14px;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .login-box button:hover { background: var(--brown); }
  .login-box button:active { transform: scale(0.98); }

  .login-error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* ---- DASHBOARD ---- */
  #dashboard { display: none; }

  header {
    padding: 32px 40px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(92,61,46,0.08);
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--brown);
    line-height: 1.1;
  }

  .header-left p {
    color: var(--text-soft);
    font-size: 14px;
    margin-top: 4px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .last-updated {
    font-size: 12px;
    color: var(--text-soft);
  }

  .refresh-btn {
    padding: 8px 16px;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s;
  }

  .refresh-btn:hover { background: var(--brown); }

  .logout-btn {
    padding: 8px 16px;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid rgba(92,61,46,0.2);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }

  main { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

  /* ---- SUMMARY CARDS ---- */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px;
    border: 1px solid rgba(92,61,46,0.08);
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
    backdrop-filter: blur(8px);
    animation: fadeUp 0.5s ease both;
  }

  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

  .card-icon { font-size: 28px; margin-bottom: 12px; }

  .card-label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-soft);
    margin-bottom: 6px;
  }

  .card-value {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--brown);
    line-height: 1;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 13px;
    color: var(--text-soft);
  }

  .card.terracotta { border-top: 3px solid var(--terracotta); }
  .card.sage       { border-top: 3px solid var(--sage); }
  .card.gold       { border-top: 3px solid var(--gold); }
  .card.blush      { border-top: 3px solid var(--blush); }
  .card.brown      { border-top: 3px solid var(--brown-light); }

  /* ---- SECTION HEADERS ---- */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--brown);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title span { font-size: 20px; }

  /* ---- TABLES ---- */
  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 24px;
  }

  .table-card {
    background: var(--card-bg);
    border-radius: 20px;
    border: 1px solid rgba(92,61,46,0.08);
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }

  .table-header {
    padding: 18px 24px;
    border-bottom: 1px solid rgba(92,61,46,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .table-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--brown);
  }

  .table-header .badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .badge-terracotta { background: rgba(196,112,79,0.12); color: var(--terracotta); }
  .badge-sage       { background: rgba(122,158,135,0.12); color: var(--sage); }
  .badge-gold       { background: rgba(201,168,76,0.12); color: #9a7a2c; }
  .badge-blush      { background: rgba(232,180,184,0.2); color: #a0606a; }
  .badge-brown      { background: rgba(92,61,46,0.10); color: var(--brown-light); }

  .table-body { padding: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    padding: 10px 24px;
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-soft);
    background: rgba(92,61,46,0.03);
    border-bottom: 1px solid rgba(92,61,46,0.06);
  }

  td {
    padding: 12px 24px;
    border-bottom: 1px solid rgba(92,61,46,0.05);
    color: var(--text);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(196,112,79,0.03); }

  .empty-state {
    padding: 32px 24px;
    text-align: center;
    color: var(--text-soft);
    font-size: 14px;
  }

  .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* ---- STATUS PILLS ---- */
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .pill-open    { background: rgba(122,158,135,0.15); color: var(--sage); }
  .pill-done    { background: rgba(92,61,46,0.08); color: var(--text-soft); text-decoration: line-through; }
  .pill-shared  { background: rgba(201,168,76,0.12); color: #9a7a2c; }
  .pill-personal{ background: rgba(196,112,79,0.10); color: var(--terracotta); }

  /* ---- FERTILITY SPECIAL CARD ---- */
  .fertility-card {
    background: linear-gradient(135deg, rgba(232,180,184,0.15), rgba(201,168,76,0.08));
    border: 1px solid rgba(232,180,184,0.3);
  }

  .fertility-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid rgba(232,180,184,0.15);
    font-size: 14px;
  }

  .fertility-row:last-child { border-bottom: none; }
  .fertility-label { color: var(--text-soft); }
  .fertility-value { font-weight: 500; color: var(--brown); }

  /* ---- LOADING ---- */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-soft);
    font-size: 14px;
    gap: 10px;
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(92,61,46,0.15);
    border-top-color: var(--terracotta);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* animation delays for cards */
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }

  .table-card:nth-child(1) { animation-delay: 0.10s; }
  .table-card:nth-child(2) { animation-delay: 0.15s; }
  .table-card:nth-child(3) { animation-delay: 0.20s; }
  .table-card:nth-child(4) { animation-delay: 0.25s; }
  .table-card:nth-child(5) { animation-delay: 0.30s; }
  .table-card:nth-child(6) { animation-delay: 0.35s; }

  @media (max-width: 768px) {
    header { padding: 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
    main { padding: 20px; }
    .tables-grid { grid-template-columns: 1fr; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🏠</div>
    <h1>Wong Family</h1>
    <p>Enter your family password to continue</p>
    <input type="password" id="password-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter Dashboard</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="header-left">
      <h1>Wong Family Dashboard 🏠</h1>
      <p class="last-updated" id="last-updated">Loading...</p>
    </div>
    <div class="header-right">
      <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <!-- SUMMARY CARDS -->
    <div class="section-title"><span>📊</span> Overview</div>
    <div class="cards-grid" id="cards-grid">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>

    <!-- TABLES -->
    <div class="section-title" style="margin-top:8px;"><span>📋</span> Details</div>
    <div class="tables-grid" id="tables-grid">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>
  </main>
</div>

<script>
const PASSWORD = 'familyisLOVE';
const API      = '/dashboard-data';

function login() {
  const val = document.getElementById('password-input').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    sessionStorage.setItem('wf_auth', '1');
    loadDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-input').focus();
  }
}

function logout() {
  sessionStorage.removeItem('wf_auth');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('password-input').value = '';
}

// Auto-login if session exists
if (sessionStorage.getItem('wf_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

async function loadDashboard() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  try {
    const res  = await fetch(API);
    const data = await res.json();
    renderCards(data);
    renderTables(data);
    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    document.getElementById('cards-grid').innerHTML  = '<div class="loading">Failed to load data. Please refresh.</div>';
    document.getElementById('tables-grid').innerHTML = '';
    document.getElementById('last-updated').textContent = 'Failed to load';
  }
}

function renderCards(data) {
  const ex = data.expenses || {};
  const ev = data.events   || [];
  const td = data.todos    || [];
  const gr = data.groceries || [];
  const fe = data.fertility || {};

  const openTasks  = td.filter(t => t.status !== 'Done').length;
  const groceryCount = gr.length;
  const monthTotal = ex.month_total || 0;
  const nextPeriod = fe.next_period || '—';
  const upcomingEv = ev.length;

  document.getElementById('cards-grid').innerHTML = `
    <div class="card terracotta">
      <div class="card-icon">💰</div>
      <div class="card-label">This Month's Spending</div>
      <div class="card-value">$${monthTotal.toFixed(2)}</div>
      <div class="card-sub">${ex.entry_count || 0} transactions</div>
    </div>
    <div class="card sage">
      <div class="card-icon">📅</div>
      <div class="card-label">Upcoming Events</div>
      <div class="card-value">${upcomingEv}</div>
      <div class="card-sub">Next 30 days</div>
    </div>
    <div class="card gold">
      <div class="card-icon">✅</div>
      <div class="card-label">Open Tasks</div>
      <div class="card-value">${openTasks}</div>
      <div class="card-sub">${td.filter(t=>t.status==='Done').length} completed</div>
    </div>
    <div class="card blush">
      <div class="card-icon">🛒</div>
      <div class="card-label">Grocery Items</div>
      <div class="card-value">${groceryCount}</div>
      <div class="card-sub">items to buy</div>
    </div>
    <div class="card brown">
      <div class="card-icon">🌸</div>
      <div class="card-label">Next Period (est)</div>
      <div class="card-value" style="font-size:20px;margin-top:4px;">${nextPeriod}</div>
      <div class="card-sub">Fertile: ${fe.fertile_window || '—'}</div>
    </div>
  `;
}

function renderTables(data) {
  const ex = data.expenses || {};
  const ev = data.events   || [];
  const td = data.todos    || [];
  const gr = data.groceries || [];
  const fe = data.fertility || {};
  const kids = data.kids   || {};

  let html = '';

  // --- EXPENSES TABLE ---
  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>💰 Expenses</h3>
      <span class="badge badge-terracotta">This Month</span>
    </div>
    <div class="table-body">`;

  if (!ex.by_category || Object.keys(ex.by_category).length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">💸</div>No expenses this month</div>`;
} else {
    // Total bar
    html += `<div style="padding:16px 24px 8px;border-bottom:1px solid rgba(92,61,46,0.06);">
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--brown);">
            <span>Total</span><span>$${ex.month_total.toFixed(2)}</span>
        </div>
    </div>`;

    // Category breakdown with visual bar
    html += `<table><thead><tr><th>Category</th><th style="text-align:right;">Amount</th><th style="text-align:right;">%</th></tr></thead><tbody>`;
    const total = ex.month_total || 1;
    Object.entries(ex.by_category)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, amt]) => {
            const pct = ((amt / total) * 100).toFixed(0);
            html += `<tr>
                <td>
                    ${cat}
                    <div style="height:3px;background:rgba(196,112,79,0.15);border-radius:2px;margin-top:4px;">
                        <div style="height:3px;width:${pct}%;background:var(--terracotta);border-radius:2px;"></div>
                    </div>
                </td>
                <td style="text-align:right;font-weight:500;">$${amt.toFixed(2)}</td>
                <td style="text-align:right;color:var(--text-soft);font-size:12px;">${pct}%</td>
            </tr>`;
        });
    html += `</tbody></table>`;

    // By account
    if (ex.by_person && Object.keys(ex.by_person).length > 0) {
        html += `<div style="padding:12px 24px;border-top:1px solid rgba(92,61,46,0.06);">
            <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);margin-bottom:8px;">By Account</div>`;
        Object.entries(ex.by_person).forEach(([acc, amt]) => {
            html += `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
                <span>${acc}</span><span style="font-weight:500;">$${amt.toFixed(2)}</span>
            </div>`;
        });
        html += `</div>`;
    }
}
  
  

  html += `</div></div>`;

  // --- CALENDAR TABLE ---
  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>📅 Upcoming Events</h3>
      <span class="badge badge-sage">Next 30 days</span>
    </div>
    <div class="table-body">`;

  if (ev.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📆</div>No upcoming events</div>`;
  } else {
    html += `<table><thead><tr><th>Date</th><th>Time</th><th>Event</th></tr></thead><tbody>`;
    ev.forEach(e => {
      html += `<tr><td>${e.date}</td><td>${e.time}</td><td>${e.title}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // --- TO-DO TABLE ---
  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>✅ To-Do List</h3>
      <span class="badge badge-gold">${td.filter(t=>t.status!=='Done').length} open</span>
    </div>
    <div class="table-body">`;

  if (td.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📋</div>No tasks yet</div>`;
  } else {
    html += `<table><thead><tr><th>Task</th><th>Type</th><th>Due</th><th>Owner</th><th>Status</th></tr></thead><tbody>`;
    td.filter(t=>t.status!=='Done').forEach(t => {
      html += `<tr>
        <td>${t.task}</td>
        <td><span class="pill ${t.type==='Shared'?'pill-shared':'pill-personal'}">${t.type}</span></td>
        <td>${t.due || '—'}</td>
        <td>${t.owner}</td>
        <td><span class="pill pill-open">Open</span></td>
      </tr>`;
    });
    td.filter(t=>t.status==='Done').slice(-3).forEach(t => {
      html += `<tr>
        <td><span class="pill pill-done">${t.task}</span></td>
        <td>—</td><td>—</td><td>${t.owner}</td>
        <td><span class="pill pill-done">Done</span></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // --- GROCERY TABLE ---
  html += `
  <div class="table-card">
    <div class="table-header">
      <h3>🛒 Grocery List</h3>
      <span class="badge badge-brown">${gr.length} items</span>
    </div>
    <div class="table-body">`;

  if (gr.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🛒</div>Nothing to buy!</div>`;
  } else {
    html += `<table><thead><tr><th>Item</th><th>Added By</th></tr></thead><tbody>`;
    gr.forEach(g => {
      html += `<tr><td>${g.name}</td><td>${g.added_by}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // --- FERTILITY ---
  html += `
  <div class="table-card fertility-card">
    <div class="table-header">
      <h3>🌸 Fertility Tracker</h3>
      <span class="badge badge-blush">Cycle Info</span>
    </div>
    <div class="table-body">`;

  if (!fe.last_period_start) {
    html += `<div class="empty-state"><div class="empty-icon">🌸</div>No period data logged yet</div>`;
  } else {
    const rows = [
      ['Last Period Start', fe.last_period_start],
      ['Period Duration',   fe.duration ? fe.duration + ' days' : '—'],
      ['Next Period (est)', fe.next_period || '—'],
      ['Fertile Window',   fe.fertile_window || '—'],
      ['Last Ovulation',   fe.last_ovulation || '—'],
      ['Recent Symptoms',  (fe.symptoms || []).join(', ') || '—'],
    ];
    rows.forEach(([label, val]) => {
      html += `<div class="fertility-row"><span class="fertility-label">${label}</span><span class="fertility-value">${val}</span></div>`;
    });
  }
  html += `</div></div>`;

  // --- KIDS ---
  ['Mikaela', 'Meaghan'].forEach(kid => {
    const kd = kids[kid] || [];
    html += `
    <div class="table-card">
      <div class="table-header">
        <h3>👧 ${kid}</h3>
        <span class="badge badge-sage">${kd.length} entries</span>
      </div>
      <div class="table-body">`;

    if (kd.length === 0) {
      html += `<div class="empty-state"><div class="empty-icon">📚</div>No entries for ${kid} yet</div>`;
    } else {
      html += `<table><thead><tr><th>Type</th><th>Title</th><th>Score</th><th>Date</th></tr></thead><tbody>`;
      kd.slice(-10).reverse().forEach(e => {
        html += `<tr><td>${e.type}</td><td>${e.title}</td><td>${e.score || '—'}</td><td>${e.date || '—'}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div></div>`;
  });

  document.getElementById('tables-grid').innerHTML = html;
}
</script>
</body>
</html>
